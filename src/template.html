<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Higher or Lower???</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="how">
        <span>How to play?</span> <br />You get your current number, you then
        guess if the hidden number is either higher or lower. You see your
        current score, and the best score you had. The numbers can be 0 - 100
      </div>

      <div class="current-number">67</div>

      <div>Hidden Number is...</div>

      <div class="buttons">
        <button class="higher">HIGHER</button>
        <button class="lower">LOWER</button>
      </div>

      <div class="hidden-number">10</div>

      <div class="score">Score:3</div>

      <div class="best">Best:10</div>
    </div>
  </body>
</html>
