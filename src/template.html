<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Higher or Lower???</title>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <div class="how-title">How to play?</div> 
        <div class="tutorial"> You get your current number, you then
        guess if the hidden number is either higher or lower. You see your current score, and the best score you had. The numbers can be 0 - 100</div>
      </header>

      <div class="game-board">

        <div class="current-number">67</div>

        <div>Hidden Number is...</div>

        <div class="buttons-div">
          <button class="lower">LOWER</button>
           <div class="hidden-number">10</div>
          <button class="higher">HIGHER</button>
        </div>

        <div class="result">FUCK</div>

        <div class="score">Score:3</div>

        <div class="best">Best:10</div>
      </div>
  </body>
</html>
